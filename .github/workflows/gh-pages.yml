on: 
  push:
    branches: [master]
    
jobs:
  gh-pages:
    # Skipped on a fork, where this job cannot succeed and never will: it pushes
    # to a `gh-pages` branch that does not exist there (so `git fetch origin
    # gh-pages` fails), using GITHUB_TOKEN, which is read-only for a fork's own
    # Actions. Publishing the API docs is a release concern of the upstream
    # repository, not of a fork, and an unconditionally red workflow on every
    # push is worse than no workflow - it trains people to read past red, which
    # is how a real failure in tests.yml gets missed. The condition is on the
    # job, not on the trigger, so nothing about the upstream behaviour changes.
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: install doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen
      - name: genereate docs
        run: |
          doxygen
          sed -i -e 's/:smiley:/\&#x1f603;/g' -e 's/:skull:/\&#x1f480;/g' html/index.html
      - name: push docs
        run: |
          git fetch --depth=1 origin gh-pages
          git checkout gh-pages
          rm -rf docs
          mv html docs
          git config --local user.email "docs-action@github.com"
          git config --local user.name "GitHub Action (docs)"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git diff --quiet || (git add docs && git commit -m 'Add docs' && git push origin gh-pages && echo Add docs)
