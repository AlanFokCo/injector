name: tests
on:
  push:
  pull_request:
  # Run on demand: `gh workflow run tests --ref master`.
  #
  # This repository is a fork, and GitHub does not start push/pull_request
  # workflows on a fork until somebody with admin rights clicks "I understand my
  # workflows, go ahead and enable them" on the Actions tab - a toggle that is
  # only reachable from the web UI, not from the REST API (the API already
  # reports actions/permissions enabled=true).
  #
  # workflow_dispatch is kept as a FALLBACK path: it is BELIEVED not to be gated
  # on that per-event toggle, which is why it stays available rather than the
  # suite silently never executing anywhere. Believed, not verified - a dispatch
  # API call returned HTTP 422 "no workflow_dispatch trigger", which only proves
  # the trigger was missing from this file. It says nothing about whether the
  # web-UI gate above would let a dispatch through, so the premise this fallback
  # rests on is still an assumption.
  #
  # As of this commit zero workflow runs have been observed on this fork, so
  # nothing in this file is proven to have executed on a real runner yet.
  workflow_dispatch:

jobs:
  tests_on_ubuntu_x86_64:
    name: Tests on Ubuntu (x86_64 and i686)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
      with:
        submodules: true
    - name: Install packages
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y gcc-multilib libgcc-s1:i386 libstdc++6:i386
        sudo apt-get remove mono-runtime
    - name: build
      run: |
        # `make cross` builds the per-arch fixtures (test-prog-x86_64,
        # test-target-i386, ...) that the arch-pair steps below run, but not the
        # unsuffixed test-target / test-library.so that the CLI steps use, so
        # build those too. `cross` also leaves src/linux/libinjector.a rebuilt
        # for the host arch; see tests/Makefile.
        cd tests && make cross && make all
    - name: unit tests
      run: |
        make unit
    - name: CLI smoke test
      run: |
        cd cmd && make
        ./injector --version
        ./injector --help
    - name: x86_64 -> x86_64
      run: |
        cd tests && ./test-prog-x86_64 x86_64
    - name: x86_64 -> i386
      run: |
        cd tests && ./test-prog-x86_64 i386
    - name: i386 -> i386
      run: |
        cd tests && ./test-prog-i386 i386
    - name: x86_64 -> x86_64 (cloned thread)
      run: |
        cd tests && ./test-prog-x86_64 x86_64 --cloned-thread
    # The suites below cover the APIs that used to be untested in CI. In
    # particular --invoke exercises the clone()/NONSTOP delivery shellcode,
    # which was completely broken (every invoke timed out) while CI stayed
    # green, because no step ever ran it.
    - name: x86_64 -> x86_64 (invoke / nonstop delivery)
      run: |
        cd tests && ./test-prog-x86_64 x86_64 --invoke
    - name: x86_64 -> x86_64 (invoke, cloned thread)
      run: |
        cd tests && ./test-prog-x86_64 x86_64 --invoke --cloned-thread
    - name: x86_64 -> x86_64 (remote-call timeout)
      run: |
        cd tests && ./test-prog-x86_64 x86_64 --timeout
    - name: x86_64 -> x86_64 (timeout, cloned thread)
      run: |
        cd tests && ./test-prog-x86_64 x86_64 --timeout --cloned-thread
    - name: x86_64 -> x86_64 (read/write target memory)
      run: |
        cd tests && ./test-prog-x86_64 x86_64 --mem
    - name: x86_64 -> x86_64 (list modules + uninject all)
      run: |
        cd tests && ./test-prog-x86_64 x86_64 --list
    - name: x86_64 -> x86_64 (find process by name)
      run: |
        cd tests && ./test-prog-x86_64 x86_64 --self-find
    - name: CLI one-shot --run across all delivery modes
      run: |
        cd tests
        # Fail with a diagnosis instead of a shell error plus a bewildering
        # "PTRACE_ATTACH error : No such process" from the first injection.
        test -x ./test-target || {
          echo "::error::tests/test-target is missing - the build step must run 'make cross && make all'"
          exit 1; }
        test -f ./test-library.so || {
          echo "::error::tests/test-library.so is missing - the build step must run 'make cross && make all'"
          exit 1; }
        # One target per invocation: test-target only lives ~6 s (SLEEP_SECS),
        # so a single target cannot outlive four sequential attach/invoke/detach
        # round trips on a loaded runner. Reusing one made this step flaky by
        # construction rather than by bug.
        for mode in auto nonstop ptrace; do
          ./test-target & tp=$!
          sleep 1
          ../cmd/injector --pid $tp --delivery $mode --timeout 10000 \
            --run "$PWD/test-library.so:entry_noarg"
          kill $tp 2>/dev/null || true
          wait $tp 2>/dev/null || true
        done
        ./test-target & tp=$!
        sleep 1
        ../cmd/injector --pid $tp --timeout 10000 \
          --run "$PWD/test-library.so:entry_threeargs" -a 1 -a 2 -a 3
        ../cmd/injector --pid $tp --info
        kill $tp 2>/dev/null || true
        wait $tp 2>/dev/null || true
    - name: CLI must reject bad input without crashing
      run: |
        cd cmd
        set +e
        fail=0
        # NOTE: never target pid 1 here. `--run` attaches, and attaching
        # patches an int3 trampoline into the target's libc; if init executes
        # it the kernel panics with "Attempted to kill init!". Argument
        # validation is exercised against pids that do not exist, and the
        # attaching cases against a throwaway target we start ourselves.
        #
        # "Does not exist" must be *proven*, and /proc alone cannot prove it:
        # a live thread's TID has NO /proc/<tid> entry (only
        # /proc/<tgid>/task/<tid>), and injector_attach() does not require a
        # thread-group leader, so PTRACE_ATTACH on a TID *succeeds*. Scanning
        # /proc for a gap can therefore land on somebody's thread - and
        # `--run /nonexistent.so:foo` attaches *before* it fails to load the
        # library, so it would really patch an int3 trampoline into that
        # thread's libc. That is precisely the accident this step exists to
        # prevent, so no /proc gap scan is used here.
        #
        # Use pid_max itself instead. The kernel only allocates pids in
        # [1, pid_max - 1], so pid_max is never a process and never a thread,
        # and - unlike a scanned gap - it cannot be claimed by a fork() in the
        # window between the check below and the attach, i.e. there is no
        # TOCTOU at all. It is still re-checked with BOTH /proc and kill -0
        # (kill -0 is what would catch a TID), and if anything answers to it
        # this step fails loudly instead of silently substituting another
        # number that has not been proven free.
        #
        # Reading pid_max is all-or-nothing for the same reason: if it cannot be
        # read there is NO number left that is proven free, and falling back to a
        # constant (32768 used to be it) is a guess - on a host with the common
        # pid_max=4194304 that constant is well inside the allocatable range and
        # may be a live process or a live thread, i.e. the `--run` cases below
        # could really patch an int3 trampoline into somebody else's libc. The
        # "(== pid_max)" wording in the messages is only true because nothing is
        # ever substituted here.
        pid_max=$(cat /proc/sys/kernel/pid_max 2>/dev/null)
        case "$pid_max" in
          ''|*[!0-9]*)
            echo "::error::cannot read /proc/sys/kernel/pid_max; refusing to guess a victim pid"
            exit 1
            ;;
        esac
        p=$pid_max
        # 4194304 == PID_MAX_LIMIT, the largest pid the CLI will accept.
        if [ "$p" -le 1 ] || [ "$p" -gt 4194304 ]; then
          echo "::error::pid_max=$p is outside the usable range (1, 4194304]; refusing to guess a victim pid"
          exit 1
        fi
        if [ -e "/proc/$p" ] || kill -0 "$p" 2>/dev/null; then
          echo "::error::pid $p (== pid_max) unexpectedly exists (/proc entry or kill -0 answered); refusing to substitute another guess"
          exit 1
        fi
        echo "exercising argument validation against pid $p (== pid_max: never allocated as a process or a thread)"
        for args in "--pid 0 --info" "--pid -1 --info" "--pid $p --info" \
                    "--pid 8589934593 --info" "--pid 4294967297 --info" \
                    "--timeout abc --pid $p --info" \
                    "--timeout 4294967300 --pid $p --info" \
                    "--timeout 0 --pid $p --info" \
                    "--delivery bogus --pid $p --run /a.so:b" \
                    "--arg 5 --pid $p" \
                    "--run /nonexistent.so:foo --pid $p" \
                    "--run /tmp/no-colon-here --pid $p" \
                    "--bogus-flag"; do
          ./injector $args >/dev/null 2>&1
          rc=$?
          if [ $rc -ge 128 ]; then echo "CRASH/SIGNAL on: $args (rc=$rc)"; fail=1; fi
          if [ $rc -eq 0 ]; then echo "UNEXPECTED SUCCESS on: $args"; fail=1; fi
        done
        # Attaching cases: throwaway target only.
        sleep 300 & tp=$!
        sleep 0.5
        for args in "--pid $tp --run /nonexistent/lib.so:foo" \
                    "--pid $tp --info"; do
          ./injector $args >/dev/null 2>&1
          rc=$?
          if [ $rc -ge 128 ]; then echo "CRASH/SIGNAL on: $args (rc=$rc)"; fail=1; fi
        done
        if ! kill -0 $tp 2>/dev/null; then
          echo "throwaway target died during CLI abuse tests"; fail=1
        fi
        # kill -0 is NOT sufficient: it also succeeds for a ptrace-stopped
        # process, which is precisely the regression this step is here to catch
        # (an attach that fails and leaves the target stopped instead of
        # detaching cleanly). Ask the kernel for the real state instead.
        # 'T' = stopped, 't' = tracing stop; both mean the target is stuck.
        state=$(awk '/^State:/ { print $2 }' "/proc/$tp/status" 2>/dev/null)
        if [ -z "$state" ]; then
          echo "could not read State: from /proc/$tp/status"; fail=1
        else
          echo "throwaway target state after CLI abuse: $state"
          case "$state" in
            T|t) echo "REGRESSION: throwaway target left stopped/tracing-stopped (State: $state)"; fail=1 ;;
          esac
        fi
        kill -CONT $tp 2>/dev/null
        kill $tp 2>/dev/null
        # Deliberately NOT probing pid 1 here. A live `--pid 1 --run ...`
        # probe is only safe if the attach-path guard is present and correct,
        # and if that guard ever regressed this very step would panic the
        # runner ("Attempted to kill init!").
        #
        # Be precise about what does and does not cover that guard, because an
        # earlier version of this comment claimed the unit tests cover it. They
        # do not, and cannot: no test in this repo attaches to pid 1 (see the
        # note at the top of tests/unit/test_guards.c), and a test that "proved"
        # the guard by ptracing init would risk the panic above on every run.
        # What the unit tests DO assert is narrower, and this comment used to
        # overstate it: test_guards.c's test_nonpositive_pid_rejected checks that
        # injector_target_info(0/-1) fails and that injector_can_attach(0/-1)
        # answers "cannot" - the pid <= 0 validation path of the entry points
        # that do not attach. NO test asserts that injector_attach() itself
        # refuses pid 1, because the only way to assert that is to call attach(1).
        # So attach's pid <= 1 guard is verified by inspection, and by the fact
        # that nothing in this suite ever attaches to pid 1 - not by a passing
        # test, and this comment is the record of that split.
        exit $fail
    # The manual flag-variant steps above (--cloned-thread, --invoke, --timeout,
    # --mem, --list, --self-find) remain the PRIMARY functional coverage: they
    # are what pins a failure to one API and one arch pair.
    #
    # This step exists to exercise the accounting that tests/Makefile's `check`
    # target wraps around them - the arch-probe RUN / SKIP / ERROR bookkeeping
    # and its summary - plus the pairs the manual list omits: `default ->
    # default`, `x86_64 -> x32`, `x32 -> i386`, and the arm pairs (not built
    # here, so they SKIP for that reason). `x86_64 -> i386` and `i386 -> i386`
    # are already covered by manual steps above and are known to work on an
    # equivalent Ubuntu x86_64 host, so re-running them here is confirmation
    # rather than new coverage.
    #
    # x32 pairs are EXPECTED to SKIP on kernels without CONFIG_X86_X32_ABI - an
    # x32 fixture links fine wherever gcc-multilib is installed, but execve
    # fails with ENOEXEC. That is by design, not a failure: `check` only errors
    # when zero pairs ran, and its summary states both counts.
    #
    # Deliberately the last step of this job: if it goes red, the manual steps
    # above have already localized the failure, so the red run stays
    # attributable. Plain `run:`, so a non-zero rc fails the job.
    - name: arch-pair accounting (make check)
      run: |
        cd tests && make check

  fuzz_regression:
    name: Fuzz regression + short fuzzing (ASan/UBSan)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Install clang
      run: |
        sudo apt-get update
        sudo apt-get install -y clang || true
        clang --version | head -1
    # Replays tests/fuzz/crashes/: minimal reproducers for memory-safety defects
    # that were found by fuzzing the ELF and /proc parsers and then fixed.
    - name: Replay saved fuzz crashers
      run: |
        cd tests/fuzz && make regress
    - name: Short fuzz session
      run: |
        cd tests/fuzz && make fuzz FUZZ_SECONDS=60 JOBS=4

  bindings:
    name: Language bindings (Go / Python / Rust)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Install toolchains
      run: |
        sudo apt-get update
        sudo apt-get install -y clang
    - uses: actions/setup-go@v5
      with:
        go-version: 'stable'
    - uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    - name: Build the C library and test fixtures
      run: |
        make
        cd tests && make build
    # The bindings link against prebuilt archives that are committed for
    # convenience. Refresh them from the sources we just built, so these jobs
    # test the current C code rather than a stale artifact.
    - name: Refresh vendored archives and headers
      run: |
        cp src/linux/libinjector.a pkg/injector/libinjector.a
        cp include/injector.h      pkg/injector/injector.h
        cp src/linux/libinjector.a bindings/rust/injector-sys/vendor/libinjector.a
        cp include/injector.h      bindings/rust/injector-sys/vendor/injector.h
    - name: Go binding
      run: |
        # -v so that SKIPs are visible: a silently skipped binding test must
        # not read as a passing one.
        cd pkg/injector && go test -v -count=1 ./...
    - name: Python binding
      run: |
        cp src/linux/libinjector.so.1.0.0 bindings/python/injector/libinjector.so
        cd bindings/python
        python3 tests/test_version.py
        python3 tests/test_binding_safety.py
        python3 tests/test_integration.py
    - name: Rust binding
      run: |
        cd bindings/rust && cargo test --locked
    # The Rust handle must NOT be Send: it is a thread-affine ptrace attachment.
    # This step fails the build if that ever regresses.
    - name: Rust Injector must not be Send
      run: |
        set -e
        d=$(mktemp -d); mkdir -p "$d/src"
        cat > "$d/Cargo.toml" <<EOF
        [package]
        name = "sendcheck"
        version = "0.0.0"
        edition = "2021"
        [dependencies]
        injector = { path = "$GITHUB_WORKSPACE/bindings/rust/injector" }
        EOF
        echo 'fn assert_send<T: Send>() {}' >  "$d/src/main.rs"
        echo 'fn main(){ assert_send::<injector::Injector>(); }' >> "$d/src/main.rs"
        cd "$d"
        # Assert on the *reason* the build failed. Treating any build failure as
        # proof of !Send would make this step vacuous: a missing vendored
        # archive or an offline registry would "pass" it just as happily.
        set +e
        err=$(cargo build 2>&1)
        rc=$?
        set -e
        if [ $rc -eq 0 ]; then
          echo "::error::Injector is Send again - that is unsound (ptrace is thread-affine)"
          exit 1
        fi
        if ! printf '%s' "$err" | grep -qE 'E0277|cannot be sent between threads'; then
          echo "::error::build failed for an unrelated reason, so !Send was not actually proven"
          printf '%s\n' "$err" | tail -25
          exit 1
        fi
        echo "ok: Injector is !Send (rejected with E0277 as expected)"

  tests_on_alpine_x86_64:
    name: Tests on Alpine (x86_64 only)
    runs-on: ubuntu-latest
    container: alpine
    steps:
    - name: Install packages
      run: |
        apk add gcc musl-dev git make
    - uses: actions/checkout@v3
      with:
        submodules: true
    - name: unit tests
      run: |
        make unit
    - name: CLI smoke test
      run: |
        cd cmd && make
        ./injector --version
        ./injector --help
    - name: run tests
      run: |
        make check
